[workspace]
# This workspace builds from a checkout of THIS repository alone. The three verification crates below
# reach the `trellis`, `work-spec` and (private) `stack-common` siblings by path, and cargo resolves every
# member's manifest before it does anything, so keeping them in would make a lone checkout unbuildable.
# They are excluded, not deleted: each is its own workspace root, and the stack's `make test-integrity-stack`
# runs them wherever the siblings are present.
members = [
    "crates/integrity-bundle",
    "crates/integrity-bundle-fixtures",
    "crates/integrity-canonical",
    "crates/integrity-cbor",
    "crates/integrity-cose",
    "crates/integrity-event",
    "crates/integrity-hpke",
    "crates/integrity-seam",
    "crates/integrity-signature",
    "crates/integrity-signature-ring",
]
resolver = "2"
exclude = [
    "crates/integrity-verify",
    "crates/integrity-verify-cli",
    "crates/integrity-verify-parity",
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
