# Its own workspace root: this crate reaches the `trellis` sibling (and, through it, the private
# `stack-common`) by path, so it is excluded from the repository workspace (see ../../Cargo.toml) and
# builds where those siblings are checked out.
[workspace]

[package]
name = "integrity-verify"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Formspec-Labs/integrity-stack"
description = "Universal verification phase for integrity envelopes (COSE_Sign1, JCS, deterministic bundles)"

[dependencies]
ciborium = "0.2"
ed25519-dalek = "2.1"
integrity-canonical = { path = "../integrity-canonical" }
integrity-bundle = { path = "../integrity-bundle" }
integrity-cose = { path = "../integrity-cose" }
serde_json = "1.0"
trellis-types = { path = "../../../trellis/crates/trellis-types" }

[dev-dependencies]
ed25519-dalek = "2.1"
trellis-export-writer = { path = "../../../trellis/crates/trellis-export-writer", features = ["fixture-inputs"] }
