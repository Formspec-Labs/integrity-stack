[package]
name = "integrity-canonical"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared canonical JSON byte primitives for integrity profiles"
repository = "https://github.com/Formspec-Labs/integrity-stack"

[dependencies]
hex = "0.4"
hmac = "0.12"
serde = "1"
# float_roundtrip keeps the correctly rounded f64 parse serde_json_canonicalizer used to switch on
# for every graph that holds this crate; raw_value lets the text API keep number text exact.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"

[dev-dependencies]
# Derives an untagged enum in a test, to show ResponseJson refuses serde's buffered values.
serde = { version = "1", features = ["derive"] }
