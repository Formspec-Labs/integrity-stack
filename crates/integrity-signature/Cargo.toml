[package]
name = "integrity-signature"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generic signature verification, key resolution, and receipt-signing ports"
repository = "https://github.com/Formspec-org/formspec"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
integrity-canonical = { path = "../integrity-canonical" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
