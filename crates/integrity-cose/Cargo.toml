[package]
name = "integrity-cose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared COSE_Sign1 byte primitives for integrity profiles"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
integrity-cbor = { path = "../integrity-cbor" }
integrity-seam = { path = "../integrity-seam" }
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
