[package]
name = "integrity-disclosure"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RFC 9901 SD-JWT selective disclosure: issue, present and verify over generic JSON claims"
repository = "https://github.com/Formspec-Labs/integrity-stack"

# Crypto ownership (fs-dlou): this crate depends on no hash or signature crate. SHA-256 comes from
# integrity-canonical, Ed25519 from integrity-cose, entropy from integrity-seam. Only base64url is
# encoded here.
[dependencies]
base64 = "0.22"
integrity-canonical = { path = "../integrity-canonical" }
integrity-cose = { path = "../integrity-cose" }
integrity-seam = { path = "../integrity-seam" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
