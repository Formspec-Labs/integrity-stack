[package]
name = "integrity-seam"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared sealing seam traits for integrity profiles"

[dependencies]
rand_core = { version = "0.6", features = ["getrandom", "std"] }
integrity-canonical = { path = "../integrity-canonical" }
integrity-cbor = { path = "../integrity-cbor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
hex = "0.4"

[dev-dependencies]
rand = "0.8"
proptest = "1"
