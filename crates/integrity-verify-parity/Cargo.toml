# Its own workspace root: this crate reaches the `trellis` sibling (and, through it, the private
# `stack-common`) by path, so it is excluded from the repository workspace (see ../../Cargo.toml) and
# builds where those siblings are checked out.
[workspace]

[package]
name = "integrity-verify-parity"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Formspec-Labs/integrity-stack"
description = "Parity harness for the Trellis verifier to integrity-verify cutover"

[dependencies]
ciborium = "0.2"
integrity-verify = { path = "../integrity-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trellis-verify-wos = { path = "../../../trellis/crates/trellis-verify-wos" }
zip = { version = "8.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
glob = "0.3"
