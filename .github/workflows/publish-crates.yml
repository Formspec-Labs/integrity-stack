name: Publish integrity-canonical

# Bootstrap the crate once, then register this repository and workflow as its trusted publisher.
on:
  push:
    tags: ["crates-v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Formspec-Labs/integrity-stack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release tag against the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "integrity-canonical") | .version')
          test "$GITHUB_REF_NAME" = "crates-v$version"
      - run: cargo package --locked -p integrity-canonical
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked -p integrity-canonical
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
